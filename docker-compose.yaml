services:
  avito-shop-service:
    build: .
    container_name: avito-shop-service
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      # Внутри сети compose Postgres доступен по имени сервиса, а не по localhost.
      DATABASE_HOST: db
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Должно быть больше SERVER_SHUTDOWN_TIMEOUT (10s), иначе Docker убьёт процесс до конца Shutdown.
    stop_grace_period: 15s
    networks:
      - internal

  db:
    image: postgres:17-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal
  migrate:
    image: migrate/migrate:v4.18.1
    container_name: migrate
    volumes:
      - ./migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://${DATABASE_USER}:${DATABASE_PASSWORD}@db:5432/${DATABASE_NAME}?sslmode=disable"
      - "up"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

networks:
  internal:

volumes:
  pgdata:
